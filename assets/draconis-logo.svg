<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Draconis Soporte Académico</title>
  <desc id="desc">Cabeza de dragón morado con gafas, barba y una llama cálida.</desc>
  <defs>
    <linearGradient id="head" x1="90" y1="80" x2="390" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b98cff"/>
      <stop offset="0.5" stop-color="#7c43d9"/>
      <stop offset="1" stop-color="#3b176c"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe0bc"/>
      <stop offset="1" stop-color="#ef7a66"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0.65" y2="0">
      <stop stop-color="#ff315f"/>
      <stop offset="0.48" stop-color="#ff7a4d"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#140820" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="228" fill="#160d21"/>
